<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Dicebound - Main hub mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:500;overflow:hidden}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

.top{grid-column:1/4;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}

.ava{width:50px;height:50px;border:2px solid var(--edge);background:linear-gradient(#aab4c0 0 34%,#e3b08a 34% 100%);position:relative}

.rnd{all:unset;cursor:pointer;width:46px;height:46px;background:var(--panel);border:2px solid var(--edge);box-shadow:0 4px 0 #000a;display:grid;place-items:center;color:var(--text);transition:transform .12s,border-color .12s,color .12s}

</style>
</head>
