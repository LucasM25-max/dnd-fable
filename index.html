<canvas id="scene"></canvas>
<div id="shade" aria-hidden="true"></div>

<div id="hud">

  <!-- top bar ------------------------------------------------------------ -->
  <header class="hud-top">
    <div id="profile" class="panel" tabindex="0" title="Character sheet — coming with the builder">
      <div class="avatar-ring">
        <img id="avatar" alt="Rowan, human fighter" width="72" height="72">
      </div>
      <div class="profile-info">
        <div class="profile-name" id="profile-name">…</div>
        <div class="profile-sub" id="profile-sub">…</div>
        <div class="xpbar" role="progressbar" aria-label="Experience">
          <div class="xpbar-fill" id="xp-fill"></div>
          <span class="xpbar-label" id="xp-label"></span>
        </div>
      </div>
    </div>

    <div id="logo" aria-label="Dicebound">
      <svg class="logo-d20"><use href="#i-d20"/></svg>
      <h1>Dicebound</h1>
      <span class="logo-tag">a voxel tale of steel &amp; sorcery</span>
    </div>

    <div id="wallet" class="panel">
      <div class="gold-chip" id="gold-chip" title="Gold — earned from matches, spent in the Armory">
        <svg><use href="#i-coin"/></svg>
        <span id="gold-value">0</span>
      </div>
      <button class="icon-btn" id="btn-settings" title="Settings (S)"><svg><use href="#i-gear"/></svg></button>
      <button class="icon-btn" id="btn-quit" title="Quit (Q)"><svg><use href="#i-quit"/></svg></button>
    </div>
  </header>

  <!-- left tiles ----------------------------------------------------------- -->
  <nav id="tiles" aria-label="Screens"></nav>

  <!-- right event cards ----------------------------------------------------- -->
  <aside id="events" aria-label="Events"></aside>

  <!-- bottom-left stats ------------------------------------------------------ -->
  <section id="stats" class="panel" aria-label="Character stats"></section>

  <!-- bottom-right encounter + play ------------------------------------------ -->
  <section id="play" class="panel" aria-label="Encounter">
    <div class="enc-row">
      <button class="arrow-btn" id="enc-prev" title="Previous encounter (←)"><svg><use href="#i-chev-l"/></svg></button>
      <div id="enc-card">
        <div class="enc-map" id="enc-map"></div>
        <div class="enc-name" id="enc-name"></div>
        <div class="enc-monsters" id="enc-monsters"></div>
        <div class="enc-meta">
          <span class="enc-level" id="enc-level"></span>
          <span class="enc-diff" id="enc-diff"></span>
        </div>
        <div class="enc-reward" id="enc-reward"></div>
      </div>
      <button class="arrow-btn" id="enc-next" title="Next encounter (→)"><svg><use href="#i-chev-r"/></svg></button>
    </div>
    <button id="btn-play" title="Start match (Enter)">
      <svg><use href="#i-swords"/></svg>
      <span>Play</span>
    </button>
  </section>

</div>

<div id="modal-root"></div>
<div id="toast-root" aria-live="polite"></div>
<div id="loader"><div class="loader-inner"><svg class="spin"><use href="#i-d20"/></svg><p>Stoking the hearth…</p></div></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="src/main.js"></script>
</body>
</html>
